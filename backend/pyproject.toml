[project]
name = "qizhi-agent-backend"
version = "0.1.0"
description = "基于 FastAPI 和 LangGraph 的全栈智能体聊天应用后端"
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "aiomysql>=0.2.0",
    "aiosqlite>=0.21.0",
    "chromadb>=0.6.3",
    "cryptography>=45.0.2",
    "fastapi[standard]>=0.115.12",
    "langchain>=0.3.25",
    "langchain-chroma>=0.2.3",
    "langchain-community>=0.3.24",
    "langchain-openai>=0.3.17",
    "langchain-mcp-adapters>=0.1.0,<0.2",
    "langgraph>=0.5.0",
    "langgraph-supervisor>=0.0.27",
    "mysql-connector-python>=9.3.0",
    "mcp>=1.9.0,<2",
    "pydantic-settings>=2.9.1",
    "pymysql>=1.1.1",
    "pypdf>=5.6.0",
    "pyppeteer>=2.0.0",
    "sqlmodel>=0.0.24",
    "uvicorn[standard]>=0.34.2",
    "agent-runtime>=0.0.1",
    "pydantic>=2.11.3",
]

[dependency-groups]
dev = [
    "uv==0.12.10",
]
